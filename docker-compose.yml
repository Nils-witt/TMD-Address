services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LISTEN_ADDR: ${LISTEN_ADDR}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-}
      # Read-only access for other apps' tokens and an mTLS proxy's clients.
      OIDC_READONLY_ISSUER_URLS: ${OIDC_READONLY_ISSUER_URLS:-}
      # Back-channel logout, shared with the other services over RabbitMQ.
      OIDC_LOGOUT_AUDIENCE: ${OIDC_LOGOUT_AUDIENCE:-}
      OIDC_LOGOUT_RETENTION: ${OIDC_LOGOUT_RETENTION:-24h}
      AMQP_URL: ${AMQP_URL:-}
      AMQP_LOGOUT_EXCHANGE: ${AMQP_LOGOUT_EXCHANGE:-oidc.logout}
      AMQP_LOGOUT_QUEUE: ${AMQP_LOGOUT_QUEUE:-oidc.logout.address}
      # Service discovery: announces address-serv and hands out API tokens.
      SERVICE_DISCOVERY_SECRET: ${SERVICE_DISCOVERY_SECRET:-}
      SERVICE_URL: ${SERVICE_URL:-}
      SERVICE_TOKEN_CLIENTS: ${SERVICE_TOKEN_CLIENTS:-tiles}
      SERVICE_TOKEN_TTL: ${SERVICE_TOKEN_TTL:-168h}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
      PROXY_AUTH_HEADER: ${PROXY_AUTH_HEADER:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # The binary is /address-serv, so its collectors folder is /collectors.
      COLLECTOR_ADMIN_GROUP: ${COLLECTOR_ADMIN_GROUP:-}
      COLLECTOR_TIMEOUT: ${COLLECTOR_TIMEOUT:-10m}
      COLLECTOR_GEO_MAX_DISTANCE_M: ${COLLECTOR_GEO_MAX_DISTANCE_M:-100}
      COLLECTOR_RUN_HISTORY: ${COLLECTOR_RUN_HISTORY:-50}
      # Time zone of collector schedules without a CRON_TZ= prefix.
      TZ: ${TZ:-}
    volumes:
      # The image has no shell or interpreters: collectors must be static
      # binaries.
      - ./collectors:/collectors:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
